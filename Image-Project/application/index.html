<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Classifier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css?v=7">
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="12" r="3.5"/></svg>
      </div>
      <div>
        <h1>Image Classifier</h1>
        <p>จำแนกสิ่งของจากกล้องหรือรูปภาพ</p>
      </div>
    </div>
    <div id="status-pill" class="status-pill" data-state="loading" role="status">
      <span class="status-dot"></span><span id="status-text">กำลังโหลดโมเดล</span>
    </div>
    <button id="theme-toggle" class="icon-button" type="button" aria-label="สลับโหมดสว่างและมืด">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main class="layout">
    <section class="card" aria-label="ข้อมูลเข้า">
      <div class="stage-head">
        <div class="segmented" role="group" aria-label="ชนิดข้อมูลเข้า">
          <button id="tab-webcam" type="button" aria-pressed="true">กล้อง</button>
          <button id="tab-file" type="button" aria-pressed="false">อัปโหลดรูปภาพ</button>
        </div>
        <span id="fps" class="badge"></span>
      </div>

      <div id="viewport" class="viewport">
        <div id="frame" class="frame"></div>
        <div id="empty" class="empty">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="12.5" r="3.5"/></svg>
          <strong id="empty-title">พร้อมเปิดกล้อง</strong>
          <span id="empty-text">กดปุ่มเปิดกล้องด้านล่าง แล้วถือสิ่งของให้อยู่ในกรอบ</span>
        </div>
        <div id="live-caption" class="live-caption" aria-hidden="true" hidden><span id="live-label"></span><span id="live-score"></span></div>
      </div>

      <div id="webcam-panel" class="controls">
        <div class="field">
          <label for="camera-select">กล้องที่ใช้</label>
          <select id="camera-select"><option value="">กล้องเริ่มต้น</option></select>
        </div>
        <label class="toggle"><input id="flip" type="checkbox" checked> กลับภาพซ้าย-ขวา</label>
        <button id="toggle-webcam" type="button" class="primary" disabled>เปิดกล้อง</button>
      </div>

      <div id="file-panel" class="controls" hidden>
        <p class="hint" style="flex: 1 1 200px">เลือกได้หลายรูป หรือลากรูปมาวางในกรอบด้านบน เช่น รูปจากโฟลเดอร์ Data-Test</p>
        <label class="primary" for="image-file" style="cursor: pointer">เลือกรูปภาพ</label>
        <input id="image-file" class="visually-hidden" type="file" accept="image/*" multiple disabled>
      </div>
      <div id="gallery" class="gallery" hidden></div>
    </section>

    <div class="side">
      <section class="card card-body" aria-label="ผลลัพธ์">
        <p class="eyebrow">ผลลัพธ์</p>
        <div class="result-head" aria-live="polite">
          <p id="top-label" class="top-label waiting">ยังไม่มีผล</p>
          <span id="top-score" class="top-score"></span>
        </div>
        <div id="bars"></div>
      </section>

      <section class="card card-body" aria-label="โมเดล">
        <p class="eyebrow">โมเดล</p>
        <div class="segmented full" role="group" aria-label="แหล่งที่มาของโมเดล">
          <button type="button" data-source="builtin" aria-pressed="true">ในโปรเจกต์</button>
          <button type="button" data-source="url" aria-pressed="false">ลิงก์</button>
          <button type="button" data-source="files" aria-pressed="false">ไฟล์</button>
        </div>
        <div class="model-fields">
          <div id="builtin-field">
            <label class="visually-hidden" for="builtin-model">โมเดลในโปรเจกต์</label>
            <select id="builtin-model"></select>
          </div>
          <div id="url-field" hidden>
            <label class="visually-hidden" for="model-url">ลิงก์โมเดล</label>
            <input id="model-url" type="url" placeholder="https://teachablemachine.withgoogle.com/models/xxxx/">
            <p class="hint link-hint">วางลิงก์แล้วโมเดลจะเปลี่ยนให้ทันที หรือกด Enter</p>
          </div>
          <label id="files-field" class="file-pick" hidden>
            <input id="model-files" class="visually-hidden" type="file" accept=".json,.bin" multiple>
            <span id="model-files-text">เลือก model.json, metadata.json และไฟล์ .bin พร้อมกัน</span>
          </label>
          <button id="load-model" class="secondary block" type="button">ใช้โมเดลนี้</button>
        </div>
        <p id="model-message" class="model-message"></p>
      </section>
    </div>
  </main>

  <script src="app.js?v=12"></script>
</body>
</html>
