<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="ภาพรวมระบบ: ข้อมูลเทรนบน Teachable Machine แล้ว export โมเดล TensorFlow.js ไปใช้ในแอปเว็บและ run_model.py">
  <style>
    .bg { fill: #f6f7fa; }
    .card { fill: #ffffff; stroke: #d9dde5; stroke-width: 1.5; }
    .title { fill: #171a21; font-size: 18px; font-weight: 700; }
    .text { fill: #4d5562; font-size: 14px; }
    .code { fill: #2f3744; font-size: 13.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { fill: #6b7280; font-size: 13px; font-weight: 600; }
    .arrow { stroke: #79808d; stroke-width: 2; fill: none; }
    .head { fill: #79808d; }
    .loop { stroke: #2f5bea; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    .loop-head { fill: #2f5bea; }
    .loop-text { fill: #2f5bea; font-size: 14px; font-weight: 600; }
    .small { font-size: 15px; }
    .step { fill: #f0f2f6; }
    .chip-web { fill: #e6ecff; }
    .chip-py { fill: #dff4ea; }
    .chip-text { fill: #171a21; font-size: 13px; font-weight: 600; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", Tahoma, sans-serif; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14171d; }
      .card { fill: #1d2129; stroke: #333945; }
      .title { fill: #eceef2; }
      .text { fill: #a9b0bc; }
      .code { fill: #c9cfd9; }
      .eyebrow { fill: #98a0ad; }
      .arrow { stroke: #8b93a1; }
      .head { fill: #8b93a1; }
      .loop { stroke: #8aa6ff; }
      .loop-head { fill: #8aa6ff; }
      .loop-text { fill: #8aa6ff; }
      .step { fill: #262b35; }
      .chip-web { fill: #24335a; }
      .chip-py { fill: #17392d; }
      .chip-text { fill: #eceef2; }
    }
  </style>
  <rect class="bg" width="1200" height="520" rx="18"/>

  <!-- 1. ข้อมูล -->
  <text class="eyebrow" x="36" y="50">1  เตรียมข้อมูล</text>
  <rect class="card" x="36" y="64" width="240" height="224" rx="14"/>
  <text class="title" x="56" y="100">ข้อมูลตัวอย่าง</text>
  <text class="code" x="56" y="134">Data-Training/</text>
  <text class="text" x="56" y="156">ตัวอย่างแยกตามคลาส</text>
  <text class="code" x="56" y="192">project.tm</text>
  <text class="text" x="56" y="214">โปรเจกต์ที่เปิดซ้ำได้</text>
  <text class="code" x="56" y="250">Data-Test/</text>
  <text class="text" x="56" y="270" font-size="13">ไว้ทดสอบหลังเทรน</text>

  <path class="arrow" d="M276 176 H318"/>
  <path class="head" d="M318 170 L330 176 L318 182 Z"/>

  <!-- 2. เทรน -->
  <text class="eyebrow" x="332" y="50">2  เทรนในเบราว์เซอร์</text>
  <rect class="card" x="332" y="64" width="220" height="224" rx="14"/>
  <text class="title" x="352" y="100">Teachable</text>
  <text class="title" x="352" y="124">Machine</text>
  <text class="text" x="352" y="160">เปิด project.tm แล้ว</text>
  <text class="text" x="352" y="182">กด Train Model</text>
  <text class="text" x="352" y="218">Export Model แบบ</text>
  <text class="text" x="352" y="240">TensorFlow.js → Download</text>

  <path class="arrow" d="M552 176 H594"/>
  <path class="head" d="M594 170 L606 176 L594 182 Z"/>

  <!-- 3. โมเดล -->
  <text class="eyebrow" x="608" y="50">3  ไฟล์โมเดล</text>
  <rect class="card" x="608" y="64" width="210" height="224" rx="14"/>
  <text class="code" x="628" y="100" font-weight="700">application/my-model/</text>
  <text class="code" x="628" y="140">model.json</text>
  <text class="text" x="628" y="160">โครงสร้าง</text>
  <text class="code" x="628" y="190">weights.bin</text>
  <text class="text" x="628" y="210">ค่าน้ำหนัก</text>
  <text class="code" x="628" y="240">metadata.json</text>
  <text class="text" x="628" y="260">ชื่อคลาสและชนิดโมเดล</text>

  <path class="arrow" d="M818 130 C 850 130, 850 112, 872 112"/>
  <path class="head" d="M870 106 L882 112 L870 118 Z"/>
  <path class="arrow" d="M818 212 C 850 212, 850 350, 872 350"/>
  <path class="head" d="M870 344 L882 350 L870 356 Z"/>

  <!-- 4. ใช้งาน -->
  <text class="eyebrow" x="884" y="50">4  นำไปใช้</text>
  <rect class="card" x="884" y="64" width="284" height="196" rx="14"/>
  <rect class="chip-web" x="904" y="82" width="52" height="24" rx="12"/>
  <text class="chip-text" x="930" y="99" text-anchor="middle">เว็บ</text>
  <text class="title" x="966" y="100">index.html</text>
  <text class="text" x="904" y="134">TensorFlow.js ทำงานในเบราว์เซอร์</text>
  <text class="text" x="904" y="162">รับข้อมูล: กล้อง ไมค์ ไฟล์</text>
  <text class="text" x="904" y="190">เลือกโมเดล: ในโปรเจกต์ ลิงก์ ไฟล์</text>
  <text class="code" x="904" y="232">bash run.sh image</text>

  <rect class="card" x="884" y="282" width="284" height="196" rx="14"/>
  <rect class="chip-py" x="904" y="300" width="68" height="24" rx="12"/>
  <text class="chip-text" x="938" y="317" text-anchor="middle">Python</text>
  <text class="title" x="982" y="318">run_model.py</text>
  <text class="text" x="904" y="352">คำนวณด้วย NumPy ไม่ต้องใช้ TensorFlow</text>
  <text class="text" x="904" y="380">รับข้อมูล: กล้อง ไมค์ ไฟล์ โฟลเดอร์</text>
  <text class="text" x="904" y="408">ต่อยอด: ใส่โค้ดของคุณใน on_result()</text>
  <text class="code" x="904" y="450">bash run.sh image python</text>

  <!-- วงรอบพัฒนาต่อ -->
  <path class="loop" d="M884 400 H834"/>
  <path class="loop-head" d="M836 394 L824 400 L836 406 Z"/>
  <path class="loop" d="M442 330 V302"/>
  <path class="loop-head" d="M436 304 L442 292 L448 304 Z"/>
  <rect class="card" x="36" y="330" width="788" height="148" rx="14"/>
  <text class="loop-text" x="56" y="364">วงรอบพัฒนาต่อ</text>
  <rect class="step" x="56" y="382" width="174" height="72" rx="10"/>
  <text class="title small" x="72" y="412">ทดสอบ</text>
  <text class="text" x="72" y="436">กับเสียงหรือภาพจริง</text>
  <rect class="step" x="246" y="382" width="174" height="72" rx="10"/>
  <text class="title small" x="262" y="412">เก็บตัวอย่าง</text>
  <text class="text" x="262" y="436">กรณีที่โมเดลยังพลาด</text>
  <rect class="step" x="436" y="382" width="174" height="72" rx="10"/>
  <text class="title small" x="452" y="412">เทรนใหม่</text>
  <text class="text" x="452" y="436">จาก project.tm เดิม</text>
  <rect class="step" x="626" y="382" width="178" height="72" rx="10"/>
  <text class="title small" x="642" y="412">แทนที่โมเดล</text>
  <text class="text" x="642" y="436">แตกไฟล์ลง my-model/</text>
</svg>
