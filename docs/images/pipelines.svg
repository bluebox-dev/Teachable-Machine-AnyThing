<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="เส้นทางข้อมูลของโมเดล Image, Audio และ Pose ตั้งแต่ข้อมูลเข้าจนถึงผลลัพธ์">
  <style>
    .bg { fill: #f6f7fa; }
    .card { fill: #ffffff; stroke: #d9dde5; stroke-width: 1.5; }
    .label { font-size: 17px; font-weight: 700; }
    .head-text { fill: #6b7280; font-size: 13px; font-weight: 600; }
    .title { fill: #171a21; font-size: 15px; font-weight: 600; }
    .text { fill: #4d5562; font-size: 13.5px; }
    .arrow { stroke: #79808d; stroke-width: 2; fill: none; }
    .tip { fill: #79808d; }
    .image { fill: #2f5bea; }
    .audio { fill: #c8402f; }
    .pose { fill: #0b7a52; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", Tahoma, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14171d; }
      .card { fill: #1d2129; stroke: #333945; }
      .head-text { fill: #98a0ad; }
      .title { fill: #eceef2; }
      .text { fill: #a9b0bc; }
      .arrow { stroke: #8b93a1; }
      .tip { fill: #8b93a1; }
      .image { fill: #8aa6ff; }
      .audio { fill: #ff9d8c; }
      .pose { fill: #5fdcaa; }
    }
  </style>
  <rect class="bg" width="1200" height="470" rx="18"/>

  <text class="head-text" x="136" y="42">ข้อมูลเข้า</text>
  <text class="head-text" x="346" y="42">เตรียมข้อมูล</text>
  <text class="head-text" x="656" y="42">โมเดล</text>
  <text class="head-text" x="966" y="42">ผลลัพธ์</text>

  <!-- Image -->
  <text class="label image" x="32" y="110">Image</text>
  <rect class="card" x="130" y="58" width="178" height="110" rx="12"/>
  <text class="title" x="146" y="100">กล้อง หรือรูปภาพ</text>
  <text class="text" x="146" y="126">ขนาดใดก็ได้</text>
  <path class="arrow" d="M308 113 H330"/><path class="tip" d="M328 107 L340 113 L328 119 Z"/>
  <rect class="card" x="340" y="58" width="280" height="110" rx="12"/>
  <text class="title" x="356" y="88">ตัดกลางภาพเป็น 224 × 224</text>
  <text class="text" x="356" y="114">สี RGB</text>
  <text class="text" x="356" y="138">ค่าสี ÷ 127 − 1</text>
  <path class="arrow" d="M620 113 H640"/><path class="tip" d="M638 107 L650 113 L638 119 Z"/>
  <rect class="card" x="650" y="58" width="280" height="110" rx="12"/>
  <text class="title" x="666" y="88">MobileNetV2</text>
  <text class="text" x="666" y="114">ได้ feature 1,280 ค่า</text>
  <text class="text" x="666" y="138">Dense 100 → Softmax</text>
  <path class="arrow" d="M930 113 H950"/><path class="tip" d="M948 107 L960 113 L948 119 Z"/>
  <rect class="card" x="960" y="58" width="208" height="110" rx="12"/>
  <text class="title" x="976" y="100">5 คลาส</text>
  <text class="text" x="976" y="126">pen, phone, card, ...</text>

  <!-- Audio -->
  <text class="label audio" x="32" y="245">Audio</text>
  <rect class="card" x="130" y="193" width="178" height="110" rx="12"/>
  <text class="title" x="146" y="235">ไมค์ หรือไฟล์เสียง</text>
  <text class="text" x="146" y="261">ช่วงละราว 1 วินาที</text>
  <path class="arrow" d="M308 248 H330"/><path class="tip" d="M328 242 L340 248 L328 254 Z"/>
  <rect class="card" x="340" y="193" width="280" height="110" rx="12"/>
  <text class="title" x="356" y="223">สเปกโตรแกรม 43 × 232</text>
  <text class="text" x="356" y="249">44.1 kHz, FFT 2048, hop 1024</text>
  <text class="text" x="356" y="273">ปรับให้ mean 0 และ std 1</text>
  <path class="arrow" d="M620 248 H640"/><path class="tip" d="M638 242 L650 248 L638 254 Z"/>
  <rect class="card" x="650" y="193" width="280" height="110" rx="12"/>
  <text class="title" x="666" y="223">Speech Commands CNN</text>
  <text class="text" x="666" y="249">Conv + MaxPool 4 ชั้น</text>
  <text class="text" x="666" y="273">Dense 2,000 → Softmax</text>
  <path class="arrow" d="M930 248 H950"/><path class="tip" d="M948 242 L960 248 L948 254 Z"/>
  <rect class="card" x="960" y="193" width="208" height="110" rx="12"/>
  <text class="title" x="976" y="235">5 คลาส</text>
  <text class="text" x="976" y="261">Background Noise, hello, ...</text>

  <!-- Pose -->
  <text class="label pose" x="32" y="380">Pose</text>
  <rect class="card" x="130" y="328" width="178" height="110" rx="12"/>
  <text class="title" x="146" y="370">กล้อง หรือรูปภาพ</text>
  <text class="text" x="146" y="396">ขนาดใดก็ได้</text>
  <path class="arrow" d="M308 383 H330"/><path class="tip" d="M328 377 L340 383 L328 389 Z"/>
  <rect class="card" x="340" y="328" width="280" height="110" rx="12"/>
  <text class="title" x="356" y="358">ตัดกลางเป็น 224 แล้วขยายเป็น 257</text>
  <text class="text" x="356" y="384">สี RGB</text>
  <text class="text" x="356" y="408">ค่าสี ÷ 127.5 − 1</text>
  <path class="arrow" d="M620 383 H640"/><path class="tip" d="M638 377 L650 383 L638 389 Z"/>
  <rect class="card" x="650" y="328" width="280" height="110" rx="12"/>
  <text class="title" x="666" y="358">PoseNet (MobileNetV1 0.75)</text>
  <text class="text" x="666" y="384">ได้ feature 17 × 17 × 51 = 14,739 ค่า</text>
  <text class="text" x="666" y="408">Dense 100 → Softmax</text>
  <path class="arrow" d="M930 383 H950"/><path class="tip" d="M948 377 L960 383 L948 389 Z"/>
  <rect class="card" x="960" y="328" width="208" height="110" rx="12"/>
  <text class="title" x="976" y="370">5 คลาส + จุด 17 จุด</text>
  <text class="text" x="976" y="396">standing, squat, ...</text>
</svg>
